<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/lovee-pwa/">
<title>LOVEE</title>
<meta name="lovee-version" content="0.6.0-7c6db96">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="description" content="LOVEE — gerçek insanlarla tanış.">
<meta name="theme-color" content="#17152A">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LOVEE">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
</head>
<body>
<style>
  /* Açılış: gece moru zemin, mercan simge, "lovee." yazısı. Flutter kendi temasını çizer. */
  @font-face { font-family: "Archivo"; font-weight: 900; font-display: swap; src: url("assets/assets/fonts/Archivo-Black.ttf") format("truetype"); }
  :root {
    --night: #17152A;
    --white: #FFFFFF;
    --soft: #B9B4D0;
    --coral: #F25C47;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--white); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center;
    padding-inline: 24px; background: var(--night); transition: opacity 0.4s ease;
  }
  #boot .mark {
    width: 72px; height: 72px; margin-inline: auto; border-radius: 22px; background: var(--coral);
    display: grid; place-items: center; color: var(--white);
    font: 900 40px/1 "Archivo", system-ui, sans-serif;
  }
  #boot h1 { margin: 0; font: 900 30px/1 "Archivo", system-ui, sans-serif; letter-spacing: -0.5px; }
  #boot h1 span { color: var(--coral); }
  #boot p { margin: 0; color: var(--soft); font-size: 14px; line-height: 1.5; max-width: 32ch; }
  #boot .bar { width: 96px; height: 4px; margin-inline: auto; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--coral); animation: slide 1.2s ease-in-out infinite; }
  #boot[data-failed] .bar { display: none; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; } }
</style>

<div id="boot" role="status" aria-live="polite">
  <div class="mark" aria-hidden="true">L</div>
  <h1>lovee<span>.</span></h1>
  <p id="boot-msg">Yükleniyor…</p>
  <div class="bar" aria-hidden="true"><i></i></div>
</div>

<script>
  // Flutter ilk kareyi çizince açılış ekranını kaldır. Yavaş bağlantıda önce bilgi ver, çok uzun sürerse uyar.
  (function () {
    var boot = document.getElementById('boot');
    var msg = document.getElementById('boot-msg');
    var done = false;
    window.addEventListener('flutter-first-frame', function () {
      done = true;
      boot.style.opacity = '0';
      setTimeout(function () { boot.hidden = true; }, 450);
    });
    setTimeout(function () { if (!done) msg.textContent = 'Bağlantı yavaş görünüyor, yükleniyor…'; }, 20000);
    setTimeout(function () {
      if (done) return;
      boot.setAttribute('data-failed', '');
      msg.textContent = 'Uygulama açılamadı. İnternet bağlantınızı kontrol edip sayfayı yenileyin.';
    }, 90000);
  })();
</script>
<script src="flutter_bootstrap.js?v=0.6.0-7c6db96" async></script>
</body>
</html>
